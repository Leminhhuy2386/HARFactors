[project]
name = "harfactors"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "whar-datasets",
    "whar-models",
    "jsonschema",
    "pyyaml",
]

# The WHAR benchmark code is the state of the WHAR Arena paper, pinned as git clones in third_party/
# (whar-datasets 144e006, whar-models 9b65004, whar-arena 19b3019; whar-arena is added via sys.path in run_whar.py).
# uv.lock comes from the HAR paper-era environment through Edge_SSM, so every package version matches the 17 baselines.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
whar-datasets = { path = "third_party/whar-datasets", editable = true }
whar-models = { path = "third_party/whar-models", editable = true }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
