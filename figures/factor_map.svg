<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" width="1120" height="900" role="img" aria-label="Factor map: data, model and evaluation factors and their effects on macro-F1" font-family="Segoe UI, system-ui, -apple-system, sans-serif"><rect x="0.5" y="0.5" width="1119.0" height="899.0" rx="10" fill="#FCFCFB" stroke="#D9D8D2" stroke-width="1"/><text x="24.0" y="34.0" font-size="15" fill="#1B2A33" text-anchor="start" font-weight="600">What moves macro-F1 on unseen people: the factors and their measured effects</text><text x="24.0" y="54.0" font-size="11" fill="#4B5B63" text-anchor="start" font-weight="normal">Arrow width grows with the typical effect in F1 points; dashed = not significant or sign depends on the dataset. Sources: 30 paper datasets, our 10 × 3 seeds, 2,460 runs.</text><rect x="435.0" y="332.0" width="250.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#1B2A33" stroke-width="2"/><text x="560.0" y="368.0" font-size="18" fill="#1B2A33" text-anchor="middle" font-weight="700">Macro-F1</text><text x="560.0" y="390.0" font-size="11.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">on people never seen in training</text><text x="560.0" y="408.0" font-size="10.5" fill="#8A8984" text-anchor="middle" font-weight="normal">(WHAR Arena protocol)</text><text x="24.0" y="76.0" font-size="11" fill="#1D6F8C" text-anchor="start" font-weight="700">DATA</text><rect x="24.0" y="84.0" width="300.0" height="78.0" rx="7" fill="#FFFFFF" stroke="#1D6F8C" stroke-width="1.4"/><rect x="24.0" y="84.0" width="6.0" height="78.0" rx="2" fill="#1D6F8C" stroke="#1D6F8C" stroke-width="0"/><text x="40.0" y="106.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Which dataset</text><text x="40.0" y="126.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">77 % of all variance (RMS 17 pts)</text><text x="40.0" y="143.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">not predicted by its size (R² 0.03, 30 sets)</text><path d="M324.0,123.0 C379.5,123.0 379.5,357.5 435.0,357.5" fill="none" stroke="#1D6F8C" stroke-opacity="0.55" stroke-width="14.0" stroke-linecap="round"/><rect x="24.0" y="172.0" width="300.0" height="78.0" rx="7" fill="#FFFFFF" stroke="#1D6F8C" stroke-width="1.4"/><rect x="24.0" y="172.0" width="6.0" height="78.0" rx="2" fill="#1D6F8C" stroke="#1D6F8C" stroke-width="0"/><text x="40.0" y="194.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Training subjects</text><text x="40.0" y="214.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">fewer people: models differ more</text><text x="40.0" y="231.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">(−1.5 pts per sd, p 0.005); trees beat deep</text><path d="M324.0,211.0 C379.5,211.0 379.5,366.5 435.0,366.5" fill="none" stroke="#1D6F8C" stroke-opacity="0.55" stroke-width="6.0" stroke-linecap="round"/><rect x="24.0" y="260.0" width="300.0" height="78.0" rx="7" fill="#FFFFFF" stroke="#1D6F8C" stroke-width="1.4"/><rect x="24.0" y="260.0" width="6.0" height="78.0" rx="2" fill="#1D6F8C" stroke="#1D6F8C" stroke-width="0"/><text x="40.0" y="282.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Number of channels</text><text x="40.0" y="302.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">more channels: Random Forest beats deep</text><text x="40.0" y="319.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">(+7.2 pts per sd, p &lt; 0.001, n 30)</text><path d="M324.0,299.0 C379.5,299.0 379.5,375.5 435.0,375.5" fill="none" stroke="#1D6F8C" stroke-opacity="0.55" stroke-width="7.0" stroke-linecap="round"/><rect x="24.0" y="348.0" width="300.0" height="78.0" rx="7" fill="#FFFFFF" stroke="#1D6F8C" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="24.0" y="348.0" width="6.0" height="78.0" rx="2" fill="#1D6F8C" stroke="#1D6F8C" stroke-width="0"/><text x="40.0" y="370.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Sampling rate (3-s windows)</text><text x="40.0" y="390.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">memory gain not tied to samples/window</text><text x="40.0" y="407.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">(ρ −0.36, n 10); WISDM 60 samples: +15</text><path d="M324.0,387.0 C379.5,387.0 379.5,384.5 435.0,384.5" fill="none" stroke="#1D6F8C" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 5"/><rect x="24.0" y="436.0" width="300.0" height="78.0" rx="7" fill="#FFFFFF" stroke="#1D6F8C" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="24.0" y="436.0" width="6.0" height="78.0" rx="2" fill="#1D6F8C" stroke="#1D6F8C" stroke-width="0"/><text x="40.0" y="458.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Number of classes</text><text x="40.0" y="478.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">memory gain larger with more classes</text><text x="40.0" y="495.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">(ρ +0.48 to +0.57, not significant)</text><path d="M324.0,475.0 C379.5,475.0 379.5,393.5 435.0,393.5" fill="none" stroke="#1D6F8C" stroke-opacity="0.55" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 5"/><rect x="24.0" y="524.0" width="300.0" height="78.0" rx="7" fill="#FFFFFF" stroke="#1D6F8C" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="24.0" y="524.0" width="6.0" height="78.0" rx="2" fill="#1D6F8C" stroke="#1D6F8C" stroke-width="0"/><text x="40.0" y="546.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Activity type</text><text x="40.0" y="566.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">gesture: shape and style; gait: memory;</text><text x="40.0" y="583.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">many sensors: group statistics</text><path d="M324.0,563.0 C379.5,563.0 379.5,402.5 435.0,402.5" fill="none" stroke="#1D6F8C" stroke-opacity="0.55" stroke-width="4.4" stroke-linecap="round" stroke-dasharray="7 5"/><text x="796.0" y="76.0" font-size="11" fill="#B85C1E" text-anchor="start" font-weight="700">MODEL</text><rect x="796.0" y="84.0" width="300.0" height="72.0" rx="7" fill="#FFFFFF" stroke="#B85C1E" stroke-width="1.4"/><rect x="796.0" y="84.0" width="6.0" height="72.0" rx="2" fill="#B85C1E" stroke="#B85C1E" stroke-width="0"/><text x="812.0" y="106.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Temporal memory vs none</text><text x="812.0" y="126.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">+5.9 [+2.8, +9.1], 10/10 datasets</text><text x="812.0" y="143.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">largest on gait (WISDM +15)</text><path d="M796.0,120.0 C740.5,120.0 740.5,353.0 685.0,353.0" fill="none" stroke="#B85C1E" stroke-opacity="0.55" stroke-width="6.0" stroke-linecap="round"/><rect x="796.0" y="164.0" width="300.0" height="72.0" rx="7" fill="#FFFFFF" stroke="#B85C1E" stroke-width="1.4"/><rect x="796.0" y="164.0" width="6.0" height="72.0" rx="2" fill="#B85C1E" stroke="#B85C1E" stroke-width="0"/><text x="812.0" y="186.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Window laws (lagged 2nd order)</text><text x="812.0" y="206.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">+2.4 [+0.4, +4.5] on RN, 8/10</text><text x="812.0" y="223.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">+5.5 on a memoryless net</text><path d="M796.0,200.0 C740.5,200.0 740.5,362.0 685.0,362.0" fill="none" stroke="#B85C1E" stroke-opacity="0.55" stroke-width="3.1" stroke-linecap="round"/><rect x="796.0" y="244.0" width="300.0" height="72.0" rx="7" fill="#FFFFFF" stroke="#B85C1E" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="796.0" y="244.0" width="6.0" height="72.0" rx="2" fill="#B85C1E" stroke="#B85C1E" stroke-width="0"/><text x="812.0" y="266.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Window statistics (std, min/max)</text><text x="812.0" y="286.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">+2.7 [-2.1, +7.5] on RN</text><text x="812.0" y="303.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">+21 on ActRecTut, +0.6 on the other 9</text><path d="M796.0,280.0 C740.5,280.0 740.5,371.0 685.0,371.0" fill="none" stroke="#B85C1E" stroke-opacity="0.55" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="7 5"/><rect x="796.0" y="324.0" width="300.0" height="72.0" rx="7" fill="#FFFFFF" stroke="#B85C1E" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="796.0" y="324.0" width="6.0" height="72.0" rx="2" fill="#B85C1E" stroke="#B85C1E" stroke-width="0"/><text x="812.0" y="346.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Memory type</text><text x="812.0" y="366.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">vs S4D: RN +0.7, Hyst −0.6, Quant −1.6 (n.s.)</text><text x="812.0" y="383.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">Mamba -2.4 (p 0.01)</text><path d="M796.0,360.0 C740.5,360.0 740.5,380.0 685.0,380.0" fill="none" stroke="#B85C1E" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/><rect x="796.0" y="404.0" width="300.0" height="72.0" rx="7" fill="#FFFFFF" stroke="#B85C1E" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="796.0" y="404.0" width="6.0" height="72.0" rx="2" fill="#B85C1E" stroke="#B85C1E" stroke-width="0"/><text x="812.0" y="426.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Per-sensor weight sharing</text><text x="812.0" y="446.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">+5 on SAD and Opportunity,</text><text x="812.0" y="463.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">−16 on single-board UTD-MHAD (seed 0)</text><path d="M796.0,440.0 C740.5,440.0 740.5,389.0 685.0,389.0" fill="none" stroke="#B85C1E" stroke-opacity="0.55" stroke-width="5.2" stroke-linecap="round" stroke-dasharray="7 5"/><rect x="796.0" y="484.0" width="300.0" height="72.0" rx="7" fill="#FFFFFF" stroke="#B85C1E" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="796.0" y="484.0" width="6.0" height="72.0" rx="2" fill="#B85C1E" stroke="#B85C1E" stroke-width="0"/><text x="812.0" y="506.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Normalization / pooling</text><text x="812.0" y="526.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">≤ ±2 points; dropping LayerNorm</text><text x="812.0" y="543.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">−2.2 outside ActRecTut</text><path d="M796.0,520.0 C740.5,520.0 740.5,398.0 685.0,398.0" fill="none" stroke="#B85C1E" stroke-opacity="0.55" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="7 5"/><rect x="796.0" y="564.0" width="300.0" height="72.0" rx="7" fill="#FFFFFF" stroke="#B85C1E" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="796.0" y="564.0" width="6.0" height="72.0" rx="2" fill="#B85C1E" stroke="#B85C1E" stroke-width="0"/><text x="812.0" y="586.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Model size</text><text x="812.0" y="606.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">no gain: ρ(log params, F1) −0.43</text><text x="812.0" y="623.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">over 30 datasets (14 deep models)</text><path d="M796.0,600.0 C740.5,600.0 740.5,407.0 685.0,407.0" fill="none" stroke="#B85C1E" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="7 5"/><text x="24.0" y="720.0" font-size="11" fill="#5B4AA8" text-anchor="start" font-weight="700">EVALUATION (why a ranking can flip)</text><rect x="24.0" y="730.0" width="204.8" height="92.0" rx="7" fill="#FFFFFF" stroke="#5B4AA8" stroke-width="1.4"/><rect x="24.0" y="730.0" width="204.8" height="6.0" rx="2" fill="#5B4AA8" stroke="#5B4AA8" stroke-width="0"/><text x="36.0" y="758.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Test person</text><text x="36.0" y="780.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">61 % of variance within a</text><text x="36.0" y="797.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">dataset; split sd ≈ 8 pts</text><path d="M126.4,730.0 C126.4,700.0 470.0,708.0 470.0,678.0 L470.0,428.0" fill="none" stroke="#5B4AA8" stroke-opacity="0.55" stroke-width="7.2" stroke-linecap="round"/><rect x="240.8" y="730.0" width="204.8" height="92.0" rx="7" fill="#FFFFFF" stroke="#5B4AA8" stroke-width="1.4"/><rect x="240.8" y="730.0" width="204.8" height="6.0" rx="2" fill="#5B4AA8" stroke="#5B4AA8" stroke-width="0"/><text x="252.8" y="758.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Training seed</text><text x="252.8" y="780.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">14 %; ±1.2–1.7 pts on a</text><text x="252.8" y="797.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">dataset mean (ActRecTut 6)</text><path d="M343.2,730.0 C343.2,700.0 515.0,708.0 515.0,678.0 L515.0,428.0" fill="none" stroke="#5B4AA8" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round"/><rect x="457.6" y="730.0" width="204.8" height="92.0" rx="7" fill="#FFFFFF" stroke="#5B4AA8" stroke-width="1.4"/><rect x="457.6" y="730.0" width="204.8" height="6.0" rx="2" fill="#5B4AA8" stroke="#5B4AA8" stroke-width="0"/><text x="469.6" y="758.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Model choice</text><text x="469.6" y="780.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">6 % (+7 % × dataset,</text><text x="469.6" y="797.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">+11 % × person)</text><path d="M560.0,730.0 C560.0,700.0 560.0,708.0 560.0,678.0 L560.0,428.0" fill="none" stroke="#5B4AA8" stroke-opacity="0.55" stroke-width="3.1" stroke-linecap="round"/><rect x="674.4" y="730.0" width="204.8" height="92.0" rx="7" fill="#FFFFFF" stroke="#5B4AA8" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="674.4" y="730.0" width="204.8" height="6.0" rx="2" fill="#5B4AA8" stroke="#5B4AA8" stroke-width="0"/><text x="686.4" y="758.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">A 2-person dataset</text><text x="686.4" y="780.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">ActRecTut alone flips the</text><text x="686.4" y="797.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">ranking of the top models</text><path d="M776.8,730.0 C776.8,700.0 605.0,708.0 605.0,678.0 L605.0,428.0" fill="none" stroke="#5B4AA8" stroke-opacity="0.55" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="7 5"/><rect x="891.2" y="730.0" width="204.8" height="92.0" rx="7" fill="#FFFFFF" stroke="#5B4AA8" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="891.2" y="730.0" width="204.8" height="6.0" rx="2" fill="#5B4AA8" stroke="#5B4AA8" stroke-width="0"/><text x="903.2" y="758.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Weak baselines, reused</text><text x="903.2" y="780.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">paper RF 65 vs tuned trees ~74.5;</text><text x="903.2" y="797.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">dev datasets: p-values optimistic</text><path d="M993.6,730.0 C993.6,700.0 650.0,708.0 650.0,678.0 L650.0,428.0" fill="none" stroke="#5B4AA8" stroke-opacity="0.55" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="7 5"/><text x="24.0" y="882.0" font-size="10.5" fill="#8A8984" text-anchor="start" font-weight="normal">arrow width</text><line x1="94.0" y1="878.0" x2="128.0" y2="878.0" stroke="#4B5B63" stroke-width="2.0"/><text x="134.0" y="882.0" font-size="10.5" fill="#8A8984" text-anchor="start" font-weight="normal">1</text><line x1="166.0" y1="878.0" x2="200.0" y2="878.0" stroke="#4B5B63" stroke-width="3.6000000000000005"/><text x="206.0" y="882.0" font-size="10.5" fill="#8A8984" text-anchor="start" font-weight="normal">3</text><line x1="238.0" y1="878.0" x2="272.0" y2="878.0" stroke="#4B5B63" stroke-width="6.000000000000001"/><text x="278.0" y="882.0" font-size="10.5" fill="#8A8984" text-anchor="start" font-weight="normal">6</text><line x1="310.0" y1="878.0" x2="344.0" y2="878.0" stroke="#4B5B63" stroke-width="10.8"/><text x="350.0" y="882.0" font-size="10.5" fill="#8A8984" text-anchor="start" font-weight="normal">12</text><text x="376.0" y="882.0" font-size="10.5" fill="#8A8984" text-anchor="start" font-weight="normal">pts</text></svg>