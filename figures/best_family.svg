<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" width="1120" height="800" role="img" aria-label="Structure of the best model family: RecurrenceNet trunk plus a window-level side path" font-family="Segoe UI, system-ui, -apple-system, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#4B5B63"/></marker></defs><rect x="0.5" y="0.5" width="1119.0" height="799.0" rx="10" fill="#FCFCFB" stroke="#D9D8D2" stroke-width="1"/><text x="24.0" y="34.0" font-size="15" fill="#1B2A33" text-anchor="start" font-weight="600">The best family so far: a RecurrenceNet trunk plus a window-level side path, joined at the head</text><text x="24.0" y="54.0" font-size="11" fill="#4B5B63" text-anchor="start" font-weight="normal">Shapes and parameter counts on UTD-MHAD (6 channels, 150 samples = 3 s at 50 Hz, 27 classes). RN + statistics = recstatnet (26.5k); RN + laws = lawnet_rec (27.6k).</text><rect x="24.0" y="96.0" width="150.0" height="250.0" rx="6" fill="#FFFFFF" stroke="#4B5B63" stroke-width="1.4"/><text x="99.0" y="116.0" font-size="12" fill="#1B2A33" text-anchor="middle" font-weight="600">Window x</text><text x="99.0" y="133.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">C channels × L</text><text x="99.0" y="148.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">samples</text><text x="99.0" y="163.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal"></text><text x="99.0" y="178.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">UTD-MHAD:</text><text x="99.0" y="193.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">6 × 150</text><text x="99.0" y="208.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">(acc xyz, gyro xyz)</text><text x="200.0" y="92.0" font-size="10.5" fill="#B85C1E" text-anchor="start" font-weight="700">TEMPORAL TRUNK (per time step, then pooled)</text><rect x="200.0" y="104.0" width="140.0" height="74.0" rx="6" fill="#FFFFFF" stroke="#B85C1E" stroke-width="1.4"/><text x="270.0" y="124.0" font-size="12" fill="#1B2A33" text-anchor="middle" font-weight="600">Encoder</text><text x="270.0" y="141.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">Linear C → 32</text><text x="270.0" y="156.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">per sample · 224</text><rect x="372.0" y="98.0" width="250.0" height="86.0" rx="6" fill="#FFFFFF" stroke="#B85C1E" stroke-width="1.4"/><text x="497.0" y="118.0" font-size="12" fill="#1B2A33" text-anchor="middle" font-weight="600">RecurrenceBlock × 3</text><text x="497.0" y="135.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">soft recurrence-plot rows</text><text x="497.0" y="150.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">over 10 lags · 7.8k each</text><text x="497.0" y="165.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">(detail below)</text><rect x="654.0" y="104.0" width="150.0" height="74.0" rx="6" fill="#FFFFFF" stroke="#B85C1E" stroke-width="1.4"/><text x="729.0" y="124.0" font-size="12" fill="#1B2A33" text-anchor="middle" font-weight="600">Mean over time</text><text x="729.0" y="141.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">150 × 32 → 32</text><line x1="174.0" y1="141.0" x2="198.0" y2="141.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><line x1="340.0" y1="141.0" x2="370.0" y2="141.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><line x1="622.0" y1="141.0" x2="652.0" y2="141.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><text x="200.0" y="218.0" font-size="10.5" fill="#1D6F8C" text-anchor="start" font-weight="700">WINDOW-LEVEL SIDE PATH (whole window, per channel or 3-axis group, before any mixing): one of</text><rect x="200.0" y="230.0" width="296.0" height="116.0" rx="6" fill="#FFFFFF" stroke="#1D6F8C" stroke-width="1.4"/><text x="348.0" y="250.0" font-size="12" fill="#1B2A33" text-anchor="middle" font-weight="600">A. Channel statistics (recstatnet)</text><text x="348.0" y="267.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">mean, std, min, max of each channel</text><text x="348.0" y="282.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">over the whole window → 4C = 24</text><text x="348.0" y="297.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">BatchNorm → Linear 24 → 32</text><text x="348.0" y="312.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">848 parameters</text><rect x="508.0" y="230.0" width="296.0" height="116.0" rx="6" fill="#FFFFFF" stroke="#1D6F8C" stroke-width="1.4"/><text x="656.0" y="250.0" font-size="12" fill="#1B2A33" text-anchor="middle" font-weight="600">B. Laws (lawnet_rec)</text><text x="656.0" y="267.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">per 3-axis group: ridge fit x(t) ≈ Aτ · x(t − τ),</text><text x="656.0" y="282.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">τ = 1, 2, 4, 8, 16 → trace, e2, det of each Aτ;</text><text x="656.0" y="297.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">covariance shape; canonical corr. of group</text><text x="656.0" y="312.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">pairs at lags −4, 0, +4 → MLP → 32 · 1,950</text><line x1="174.0" y1="288.0" x2="198.0" y2="288.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><rect x="850.0" y="96.0" width="246.0" height="250.0" rx="8" fill="#FFFFFF" stroke="#1B2A33" stroke-width="1.6"/><text x="973.0" y="118.0" font-size="12" fill="#1B2A33" text-anchor="middle" font-weight="600">Head (joins the two paths)</text><rect x="868.0" y="136.0" width="210.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#D9D8D2" stroke-width="1"/><text x="973.0" y="153.0" font-size="11.5" fill="#1B2A33" text-anchor="middle" font-weight="600">concat</text><text x="973.0" y="168.0" font-size="10" fill="#4B5B63" text-anchor="middle" font-weight="normal">32 trunk + 32 side = 64</text><rect x="868.0" y="186.0" width="210.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#D9D8D2" stroke-width="1"/><text x="973.0" y="203.0" font-size="11.5" fill="#1B2A33" text-anchor="middle" font-weight="600">LayerNorm</text><text x="973.0" y="218.0" font-size="10" fill="#4B5B63" text-anchor="middle" font-weight="normal">64</text><line x1="973.0" y1="176.0" x2="973.0" y2="185.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><rect x="868.0" y="236.0" width="210.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#D9D8D2" stroke-width="1"/><text x="973.0" y="253.0" font-size="11.5" fill="#1B2A33" text-anchor="middle" font-weight="600">Linear 64 → K</text><text x="973.0" y="268.0" font-size="10" fill="#4B5B63" text-anchor="middle" font-weight="normal">1,755 parameters (K = 27)</text><line x1="973.0" y1="226.0" x2="973.0" y2="235.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><rect x="868.0" y="286.0" width="210.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#D9D8D2" stroke-width="1"/><text x="973.0" y="303.0" font-size="11.5" fill="#1B2A33" text-anchor="middle" font-weight="600">class scores</text><text x="973.0" y="318.0" font-size="10" fill="#4B5B63" text-anchor="middle" font-weight="normal">softmax, cross-entropy</text><line x1="973.0" y1="276.0" x2="973.0" y2="285.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><line x1="804.0" y1="141.0" x2="848.0" y2="156.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><line x1="804.0" y1="288.0" x2="848.0" y2="156.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><rect x="24.0" y="372.0" width="1072.0" height="272.0" rx="8" fill="#FFFFFF" stroke="#B85C1E" stroke-width="1.2"/><text x="40.0" y="396.0" font-size="12.5" fill="#1B2A33" text-anchor="start" font-weight="600">Inside one RecurrenceBlock (d = 32): each time step asks &quot;am I back where I was τ steps ago?&quot;</text><rect x="40.0" y="442.0" width="110.0" height="60.0" rx="6" fill="#FFFFFF" stroke="#B85C1E" stroke-width="1.4"/><text x="95.0" y="462.0" font-size="12" fill="#1B2A33" text-anchor="middle" font-weight="600">h(t)</text><text x="95.0" y="479.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">32 values</text><rect x="176.0" y="442.0" width="110.0" height="60.0" rx="6" fill="#FFFFFF" stroke="#4B5B63" stroke-width="1.4"/><text x="231.0" y="462.0" font-size="12" fill="#1B2A33" text-anchor="middle" font-weight="600">LayerNorm</text><text x="231.0" y="479.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">per time step</text><rect x="316.0" y="418.0" width="180.0" height="52.0" rx="6" fill="#FFFFFF" stroke="#4B5B63" stroke-width="1.4"/><text x="406.0" y="438.0" font-size="11.5" fill="#1B2A33" text-anchor="middle" font-weight="600">mix_in</text><text x="406.0" y="455.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">Linear 32 → 32 = u(t)</text><rect x="316.0" y="484.0" width="180.0" height="52.0" rx="6" fill="#FFFFFF" stroke="#4B5B63" stroke-width="1.4"/><text x="406.0" y="504.0" font-size="11.5" fill="#1B2A33" text-anchor="middle" font-weight="600">embed</text><text x="406.0" y="521.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">Linear 32 → 16 = 8 points z(t) in 2-D</text><rect x="528.0" y="476.0" width="270.0" height="70.0" rx="6" fill="#FFFFFF" stroke="#4B5B63" stroke-width="1.4"/><text x="663.0" y="496.0" font-size="11.5" fill="#1B2A33" text-anchor="middle" font-weight="600">soft recurrence, 10 lags</text><text x="663.0" y="513.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">r(t, τ) = σ((ε − ‖z(t) − z(t − τ)‖) / 0.1)</text><text x="663.0" y="528.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">τ = 1, 2, 4, 6, 8, 12, 16, 24, 32, 48 → 80</text><rect x="528.0" y="552.0" width="270.0" height="46.0" rx="6" fill="#FFFFFF" stroke="#4B5B63" stroke-width="1.4"/><text x="663.0" y="572.0" font-size="11" fill="#1B2A33" text-anchor="middle" font-weight="600">line = r(t, τ) · r(t − 1, τ)</text><text x="663.0" y="589.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">recurrence held two steps → 80</text><rect x="830.0" y="442.0" width="120.0" height="60.0" rx="6" fill="#FFFFFF" stroke="#4B5B63" stroke-width="1.4"/><text x="890.0" y="462.0" font-size="11.5" fill="#1B2A33" text-anchor="middle" font-weight="600">mix_out</text><text x="890.0" y="479.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">[u, r, line] = 192</text><text x="890.0" y="494.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">Linear → 32, GELU</text><rect x="976.0" y="442.0" width="104.0" height="60.0" rx="6" fill="#FFFFFF" stroke="#B85C1E" stroke-width="1.4"/><text x="1028.0" y="462.0" font-size="11.5" fill="#1B2A33" text-anchor="middle" font-weight="600">h(t) + ·</text><text x="1028.0" y="479.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">residual</text><text x="1028.0" y="494.0" font-size="10.5" fill="#4B5B63" text-anchor="middle" font-weight="normal">→ next block</text><line x1="150.0" y1="472.0" x2="174.0" y2="472.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><line x1="286.0" y1="472.0" x2="314.0" y2="444.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><line x1="286.0" y1="472.0" x2="314.0" y2="510.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><line x1="496.0" y1="510.0" x2="526.0" y2="510.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><line x1="663.0" y1="546.0" x2="663.0" y2="550.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><line x1="496.0" y1="444.0" x2="828.0" y2="464.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><line x1="798.0" y1="511.0" x2="828.0" y2="476.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><line x1="798.0" y1="575.0" x2="828.0" y2="488.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><line x1="950.0" y1="472.0" x2="974.0" y2="472.0" stroke="#4B5B63" stroke-width="1.4" marker-end="url(#ah)"/><text x="40.0" y="628.0" font-size="10.5" fill="#8A8984" text-anchor="start" font-weight="normal">ε = learned radius per embedded point (8 values); points before t = τ get r = 0. All 10 lags read the same 2-D embeddings, so the block compares the signal with itself, not with templates.</text><rect x="24.0" y="664.0" width="346.7" height="108.0" rx="6" fill="#FFFFFF" stroke="#D9D8D2" stroke-width="1"/><text x="38.0" y="686.0" font-size="12" fill="#1B2A33" text-anchor="start" font-weight="600">Results (3 seeds, 10 datasets)</text><text x="38.0" y="708.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">RN + statistics 74.70; RN + laws 74.42</text><text x="38.0" y="726.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">RecurrenceNet 72.01; S4D 71.29</text><text x="38.0" y="744.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">RN + laws − S4D +3.12, Holm p 0.049</text><rect x="386.7" y="664.0" width="346.7" height="108.0" rx="6" fill="#FFFFFF" stroke="#D9D8D2" stroke-width="1"/><text x="400.7" y="686.0" font-size="12" fill="#1B2A33" text-anchor="start" font-weight="600">Where each path pays</text><text x="400.7" y="708.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">trunk: gait and gesture shape (+6 vs no memory)</text><text x="400.7" y="726.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">statistics: ActRecTut +21, SAD +3</text><text x="400.7" y="744.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">laws: SAD +5.8, DSADS +4.2, UniMiB +3.6</text><rect x="749.3" y="664.0" width="346.7" height="108.0" rx="6" fill="#FFFFFF" stroke="#D9D8D2" stroke-width="1"/><text x="763.3" y="686.0" font-size="12" fill="#1B2A33" text-anchor="start" font-weight="600">Cost and edge</text><text x="763.3" y="708.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">26.5k / 27.6k parameters; ~5.7 MFLOPs per window</text><text x="763.3" y="726.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">side path = running sums per sample</text><text x="763.3" y="744.0" font-size="10.8" fill="#4B5B63" text-anchor="start" font-weight="normal">laws: 3×3 lagged covariances, 3×3 solves per window</text></svg>